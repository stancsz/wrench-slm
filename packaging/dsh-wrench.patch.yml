# Apply with: dsh --profile headless --patch .\dsh-wrench.patch.yml
# This overlay points DeepSeek Harness at the package-local endpoint.
- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: http://127.0.0.1:28900/v1
    models:
      - id: wrench-local
        name: Wrench local Experimental Preview
        contextWindow: 4000000
        maxTokens: 256
    defaultModel:
      id: wrench-local
- id: llm-deepseek
  config:
    # Keep the local sentinel explicit for current DSH releases. Older
    # releases used apiKeyEnv, so retain it for backward compatibility.
    apiKey: wrench-local
    apiKeyEnv: WRENCH_LOCAL_API_KEY
    baseURL: http://127.0.0.1:28900/v1
    models:
      - id: wrench-local
        name: Wrench local Experimental Preview
        contextWindow: 4000000
        maxTokens: 256
    defaultModel:
      id: wrench-local
- id: agent-default-model
  config:
    provider: deepseek-official
    model: wrench-local
