# Ephemeral v97 smoke overlay. It keeps the existing DSH profile untouched.
- id: llm-deepseek
  config:
    apiKeyEnv: WRENCH_LOCAL_API_KEY
    baseURL: http://127.0.0.1:28918/v1
    models:
      - id: wrench-v97
        name: Wrench compact v97
        contextWindow: 4000000
        maxTokens: 256
    defaultModel:
      id: wrench-v97
- id: agent-default-model
  config:
    provider: deepseek-official
    model: wrench-v97
