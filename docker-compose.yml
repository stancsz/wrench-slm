services:
  wrench-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wrench-sidecar
    restart: always
    ports:
      - "4010:4010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Denver
      - LEAN_ROUTER_LOGS_DIR=/gateway_logs
      - SIDECAR_PORT=4010
      - PYTHONUNBUFFERED=1
    volumes:
      - ./wrench:/app/wrench
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - C:/Users/stanc/github/lean-router/logs:/gateway_logs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
